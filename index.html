<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    <script>
        function book(){
         document.getElementById("booking").style.display="block";
         document.getElementById("name").innerHTML=document.getElementById("movie").value;
          document.getElementById("the").innerHTML=document.getElementById("theat").value;
           document.getElementById("date").innerHTML=document.getElementById("date1").value;
            document.getElementById("time").innerHTML=document.getElementById("time1").value;
             document.getElementById("seat").innerHTML=document.getElementById("seat1").value;
              let moviename=document.getElementById("movie").value;
             if(moviename=="varanasi"){
                document.getElementById("poster").src="images5.jpg";
             } else if( moviename=="doomsday"){
                   document.getElementById("poster").src="images 2.jpg";      
             }
             else{
                 document.getElementById("poster").src="images1.jpg"; 
             }
        }
    </script>
    <style> 
   #list span{
    margin-bottom:10px;
   }
    </style>
</head>
<body>
    <div class="mt-3 d-flex justify-content-center bg-primary p-3  ">
        <div class="me-3">
            <select class="form-select  " id="movie">
                <option>
                    Select Movie
                </option>
                <option> varanasi </option>
                <option>doomsday</option>
            </select>

        </div>
        <div class="me-3">
            <select class="form-select" id="theat">
                <option>Select Theatre</option>
                <option>Nellore</option>
                <option> TIrupathi</option>
            </select>
        </div>
        <div  class="me-3">
             <select class="form-select" id="date1">
                <option>  Select Date</option>
                <option> today</option>
                <option> tomorrow</option>
             </select>
        </div>
        <div class="me-3">
            <select class="form-select" id="time1">
                <option> Select Time</option>
                <option>
                    morning 
                </option>
                <option> Afternoon</option>
                <option>evening</option>
                <option> Night</option>
            </select>
        </div>
        <div class="me-3">
            <select class="form-select" id="seat1">
            <option>Select Seat</option>
            <option> front</option>
            <option> corner</option>
            <option>last </option>
            </select>
        </div>
    </div>
        <div class="text-center mt-4  ">
 <button class="btn btn-danger " onclick="book()">Book</button>
    </div>
    <div id="booking" class="mt-4"style="display:none">
        <dl class=" text-center w-100">
            <h3 class=" bg-dark  p-2 text-white">Booking Summary</h3>

            <dt>
                <img id="poster"width="20%" height="200">
            </dt>
            <div  id="list"  class="mx-auto text-start" style="max-width: 200px;" style="text-align:left" >
            <b >Movie Name:</b><span id="name"></span><br>

            <b>Theatre:</b><span id="the"></span><br>
            <b>Date:</b>
            <span id="date"></span><br>
            <b>Time:</b>
            <span id="time"></span><br>
            <B>Seat number:</B>
            <span id="seat"></span>
            </div>
    
        </dl>
    </div>
</body>
</html>
